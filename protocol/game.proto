// 新版游戏业务唯一通信契约；生成 TS/Java，禁止复用已发布字段号。
// WebSocket 使用 mxzg.protobuf.v2 子协议，线上使用 WSS；不是旧服协议兼容层。
syntax = "proto2";
package mxzg.game;
option java_package = "com.funsgamex.mxzg.protocol";
option java_outer_classname = "GameProtocol";

// 信封只关联一次传输；业务幂等键须由具体业务另行定义。
message Frame {
  required uint32 version = 1;
  required string kind = 2;
  required string name = 3;
  optional string id = 4;
  optional string connection_id = 5;
  optional bool ok = 6;
  optional Failure error = 7;
  oneof payload {
    Authenticate authenticate = 10;
    Accepted accepted = 11;
    Snapshot snapshot = 12;
    Inventory inventory = 13;
    Heartbeat heartbeat = 14;
    Kicked kicked = 15;
    Empty empty = 16;
    Login login = 17;
    Servers servers = 18;
    GmGrant gm_grant = 19;
    GmResult gm_result = 20;
    GmStatus gm_status = 21;
    FormationSave formation_save = 22;
    FormationSaved formation_saved = 23;
    BattlePreviewRequest battle_preview = 24;
    BattlePreviewResult battle_previewed = 25;
    ChapterChallenge chapter_challenge = 26;
    ChapterBattleId chapter_battle_id = 27;
    ChapterReceipt chapter_receipt = 28;
    ChapterReplay chapter_replay = 29;
    IdleEncounter idle_encounter = 30;
    ChapterIdleClaim chapter_idle_claim = 31;
    ChapterIdleClaimStatusRequest chapter_idle_claim_status_request = 32;
    ChapterIdleClaimReceipt chapter_idle_claim_receipt = 33;
    ChapterIdleClaimStatus chapter_idle_claim_status = 34;
  }
}
message Empty {}
// 本地身份交换只在 local 后端启用，生产渠道认证另行接入。
message Login { required string account = 1; required string server_id = 2; required string client_instance_id = 3; }
message Session { required string access_token = 1; required string expires_at = 2; }
message Server { required string id = 1; required string region_id = 2; required string region_name = 3; required string name = 4; required bool enabled = 5; }
message Servers { repeated Server items = 1; }
message Authenticate {
  required string access_token = 1;
  required string client_instance_id = 2;
}
message Accepted {
  required string connection_id = 1;
  required string role_id = 2;
  required int64 server_time_ms = 3;
  required Snapshot initial = 4;
  optional Session session = 5;
}
message Heartbeat { required int64 server_time_ms = 1; }
message Failure {
  required string code = 1;
  required string message = 2;
  required bool retryable = 3;
}
message Kicked { required string code = 1; }
message Role {
  required string id = 1;
  required string nickname = 2;
  required uint32 level = 3;
  required int64 gold = 4;
  required int64 diamonds = 5;
  required string server_id = 6;
  // 基础资料独立扩展，缺失表示尚未同步，不能当作全零玩家。
  optional RoleBasics basics = 7;
}
// 对照旧 2001；经验为本级经验，时间为 Unix 秒，0 时间表示历史未知。
message RoleBasics {
  required int64 experience = 1;
  required uint32 cup = 2;
  required uint32 head_id = 3;
  required uint32 image_id = 4;
  required uint32 border_id = 5;
  required uint32 language = 6;
  required int64 created_at_seconds = 7;
  required int64 last_login_at_seconds = 8;
  // 来自 mainlevel 当前级门槛；最高级为 0，不授予升级或奖励。
  required int64 experience_to_next_level = 9;
}
message Hero {
  required string id = 1;
  required uint32 template_id = 2;
  required uint32 level = 3;
  required uint32 star = 4;
  // 英雄自身的持久锁定，不等于未获得或阵容占用；缺失表示旧快照尚未同步。
  optional bool locked = 5;
  // 是否在主线阵容中；由服务端按本角色持久阵容计算。
  optional bool deployed = 6;
  optional uint32 stage = 7;
  // 仅基础成长属性，不含尚未恢复的装备/天赋等加成。
  optional HeroBaseStats base_stats = 8;
  // 普通四槽的完整穿戴状态；缺失表示未同步，空 items 表示未穿戴。
  optional HeroEquipmentState equipment = 9;
  // 服务端面板计算及覆盖范围；未完整恢复时 complete=false。
  optional HeroPanelStats panel_stats = 10;
  optional HeroEvolution evolution = 11;
}
message HeroBaseStats { required uint32 hp = 1; required uint32 atk = 2; required uint32 def = 3; required uint32 spd = 4; }
message Item {
  required uint32 item_id = 1;
  required int64 quantity = 2;
  // 稳定数据 ID；item_id 保持原配置 ID 含义，禁止重用字段号。
  optional string instance_id = 3;
}
message Inventory { repeated Item items = 1; }
message Snapshot {
  required Role role = 1;
  repeated Hero heroes = 2;
  repeated Item inventory = 3;
  required int64 revision = 4;
  optional TimedInventory timed_inventory = 5;
  optional HeroRoster hero_roster = 6;
  optional MainFormation main_formation = 7;
  optional MainChapterState main_chapter = 8;
  optional MainChapterIdleState main_chapter_idle = 9;
  // 精灵独立实例；缺失表示未同步，不能混入按item_id唯一的普通库存。
  optional SpiritInventory spirit_inventory = 10;
}

// 服务端最终容量已经包含 VIP 加成；缺失表示尚未同步，不能当作零容量。
message HeroRoster {
 required uint32 capacity = 1;
 required uint32 buy_space_times = 2;
}

// 期限道具每件一个实例；时间单位为 Unix 秒，与角色等级等无关。
message TimedItem {
 required string instance_id = 1;
 required uint32 item_id = 2;
 required int64 active_at_seconds = 3;
 required int64 expires_at_seconds = 4;
}
message TimedInventory {
 repeated TimedItem items = 1;
 required int64 server_time_seconds = 2;
}

// 当前只恢复2000002的真实实例和只读背包展示，不开放养成或穿脱协议。
message SpiritInventory {
  required uint32 schema_version = 1;
  repeated SpiritItem items = 2;
}
message SpiritItem {
  // 与配置ID分开；同配置同属性的实例也不能合并，字符串保留持久身份。
  required string instance_id = 1;
  required uint32 item_id = 2;
  // 旧实际生成和持久链只有一个能力，不沿旧Lua描述符改成多能力。
  required uint32 ability_id = 3;
  repeated SpiritSkill skills = 4;
}
message SpiritSkill {
  required uint32 sort = 1;
  required uint32 skill_id = 2;
  required uint32 level = 3;
}

// 本机开发 GM；目标角色只从鉴权连接获取。
message GmGrant { required string request_id = 1; required string kind = 2; required uint32 config_id = 3; required uint32 quantity = 4; }
message GmResult { required string request_id = 1; required string kind = 2; required uint32 config_id = 3; required uint32 quantity = 4; }
message GmStatus { required bool enabled = 1; }

// 装备实例 ID 用字符串保留精度，不与配置 ID 混用。
message HeroEquipment { required string instance_id = 1; required uint32 template_id = 2; required uint32 slot = 3; required uint32 soul_level = 4; optional HeroSoulSkill soul_skill = 5; }
message HeroEquipmentState { repeated HeroEquipment items = 1; }
message HeroPanelValues { required int64 hp = 1; required int64 atk = 2; required int64 def = 3; required int64 spd = 4; }
message HeroPanelStats { required HeroPanelValues values = 1; repeated string included_sources = 2; repeated string pending_sources = 3; required bool complete = 4; }
// 缺失表示未生效；由服务端结合真实英雄与装备门槛计算。
message HeroSoulSkill { required uint32 skill_id = 1; required uint32 level = 2; }

// 0/0明确未进化；缺失表示未同步，技能覆盖由服务端验证。
message HeroEvolution { required uint32 type = 1; required uint32 level = 2; optional HeroSoulSkill skill = 3; }

// 只读主线阵型，所有状态由服务端持久化；未提供保存协议。
message MainFormation { required uint32 formation_id = 1; repeated uint32 unlocked_ids = 2; required bool assistance_unlocked = 3; required int64 version = 4; repeated FormationSlot slots = 5; repeated FormationOption options = 6; }
message FormationSlot { required uint32 position = 1; required string hero_id = 2; }

// 主线保存：角色归属由鉴权连接确定，request_id是持久幂等键。
message FormationSave {
  required string request_id = 1;
  required int64 expected_version = 2;
  required uint32 formation_id = 3;
  repeated FormationSlot slots = 4;
}
// 回执不直接写客户端Model；权威阵容仍随state.changed或重连快照同步。
message FormationSaved {
  required string request_id = 1;
  required int64 version = 2;
}

// 可选阵型与当前允许站位由服务端同源配置投影，不由客户端猜测。
message FormationOption { required uint32 formation_id = 1; repeated uint32 open_positions = 2; }

// 独立关卡验收战报；尚未注册业务消息，不开放挑战/奖励接口。
message BattleReplay {
  required uint32 schema_version = 1;
  required string scenario = 2;
  required string outcome = 3;
  required uint32 rounds = 4;
  repeated BattleReplayUnit units = 5;
  repeated BattleReplayPhase phases = 6;
  // 开战时冻结的双方名称；旧战报缺失时不得使用当前昵称补历史。
  optional string attacker_name = 7;
  optional string defender_name = 8;
}
message BattleReplayUnit {
  required uint32 unit_id = 1;
  required uint32 template_id = 2;
  required uint32 position = 3;
  required int64 initial_hp = 4;
  required int64 final_hp = 5;
  // 服务端战斗快照等级；旧战报可解码，但展示层须明确拒绝缺失值。
  optional uint32 level = 6;
  // 本场阵营：1攻方、2守方，不从unit_id推断。
  optional uint32 faction = 7;
  // 与初始生命分开，残血入场也按真实最大生命显示血条。
  optional int64 max_hp = 8;
  // 服务端按旧HeroFightLog累计abs(实际扣血变化+护盾吸收)，缺失表示旧战报未记录，不能当0。
  optional int64 total_damage = 9;
  // 实际承伤绝对值；与旧伤害输出口径不同，不按飘字累计。
  optional int64 total_taken_damage = 10;
  // 旧replenish记录施法者的修正后治疗量，包含溢出治疗；保留有符号值，不取绝对值。
  optional int64 total_recovery = 11;
  // 本场英雄星级；旧战报缺失时不从当前名册补历史外观。
  optional uint32 star = 12;
  // 开战时按历史星级/进化解析的头像资源ID；缺失为旧战报，不读当前英雄补齐。
  optional uint32 portrait_icon_id = 13;
}
message BattleReplayPhase {
  required uint32 round = 1;
  // 0为回合开始，1/2为当前双单位验收场景出手者。
  required uint32 source_id = 2;
  repeated BattleReplayEvent events = 3;
}
// recovery事件复用actual_hp_change/reported_hp_change和dead=false；实际回血与含溢出治疗量不可混用。
message BattleReplayEvent {
  required string kind = 1;
  required uint32 source_id = 2;
  required uint32 target_id = 3;
  required uint32 config_id = 4;
  optional uint32 skill_level = 5;
  optional uint32 skill_type = 6;
  optional int64 actual_hp_change = 7;
  optional int64 reported_hp_change = 8;
  optional bool dead = 9;
  optional int64 buff_instance_id = 10;
  optional uint32 expires_at_round = 11;
  optional int64 buff_value = 12;
  optional string removal_reason = 13;
}

// 开发只读试战：只提交关卡，不接受角色、阵容、属性或伤害；不产生通关与奖励。
message BattlePreviewRequest { required uint32 mission = 1; }
message BattlePreviewResult {
  required uint32 mission = 1;
  required int64 asset_revision = 2;
  required int64 lineup_version = 3;
  required uint32 formation_id = 4;
  repeated string pending = 5;
  required BattleReplay replay = 6;
}

// 主线进度随登录及state.changed同步；缺失表示未同步，不默认未通关。
message MainChapterState { required uint32 max_cleared = 1; optional string pending_battle_id = 2; required int64 asset_revision = 3; }
// request_id是持久幂等键；重试同一次挑战必须复用，客户端不提交胜负和奖励。
message ChapterChallenge { required string request_id = 1; }
message ChapterBattleId { required string battle_id = 1; }
message ChapterReward { required uint32 item_id = 1; required int64 quantity = 2; }
// 历史回执不覆盖统一资产快照；BATTLE需读取持久战报，SETTLED表示只补领奖。
message ChapterReceipt { required string action = 1; required string battle_id = 2; required MainChapterState state = 3; repeated ChapterReward rewards = 4; optional ChapterExperience experience = 5; }
// 发奖事务前后冻结的经验展示；历史回执缺失时不从当前余额反推，不写回角色Model。
message ChapterExperience {
  required uint32 before_level = 1;
  required int64 before_exp = 2;
  required int64 before_threshold = 3;
  required uint32 after_level = 4;
  required int64 after_exp = 5;
  required int64 after_threshold = 6;
}
// 登录只恢复进度；玩家选择继续观看时按归属读取原战报，不重新计算。
message ChapterReplay { required string battle_id = 1; required uint32 mission = 2; repeated string pending = 3; required BattleReplay replay = 4; }

// 主线挂机只读快照；时间为服务器Unix秒，rates为每frequency秒的基础收益，不是已到账奖励。
message MainChapterIdleState {
  required int64 server_time = 1;
  required int64 started_at = 2;
  required uint32 max_seconds = 3;
  required uint32 frequency = 4;
  required uint32 reward_stage = 5;
  repeated ChapterReward rates = 6;
  repeated FormationSlot slots = 7;
  optional int64 lineup_version = 8;
  // 领取状态缺失、未知格式或非ENABLED均只读；不为展示查询完整收益输入。
  optional MainChapterIdleClaimState claim_state = 9;
}

// 独立挂机消费版本，不等同于资产revision；全部int64须在JS安全整数范围内。
message MainChapterIdleClaimState {
  required uint32 schema_version = 1;
  required int64 operation_version = 2;
  // READ_ONLY保持按钮关闭；ENABLED只表示入口启用，不保证本次权益输入可用。
  required string request_mode = 3;
}

// 业务request_id跨超时、重连不变；角色、时长、收益和随机源由服务端决定。
message ChapterIdleClaim {
  required string request_id = 1;
  required int64 expected_operation_version = 2;
}

// 只查询当前认证角色指定请求的已提交结果，不查询库存、不重算收益。
message ChapterIdleClaimStatusRequest { required string request_id = 1; }

// 历史领取回执只供操作确认与展示，不能覆盖统一Snapshot中的当前资产和挂机起点。
message ChapterIdleClaimReceipt {
  required uint32 schema_version = 1;
  required string request_id = 2;
  required string receipt_id = 3;
  required int64 expected_operation_version = 4;
  required int64 before_operation_version = 5;
  required int64 after_operation_version = 6;
  required int64 committed_at_seconds = 7;
  required int64 previous_started_at_seconds = 8;
  required uint32 seconds = 9;
  required uint32 max_seconds = 10;
  required uint32 reward_stage = 11;
  required int64 asset_revision = 12;
  repeated ChapterReward theoretical_rewards = 13;
  required RewardGrantResult actual = 14;
  optional ChapterExperience experience = 15;
}

// COMMITTED必须携带原receipt，NOT_FOUND禁止携带；没有持久处理中记录，不定义PENDING。
message ChapterIdleClaimStatus {
  required string request_id = 1;
  required string status = 2;
  optional ChapterIdleClaimReceipt receipt = 3;
}

// 同次可信发放的实际明细，不是客户端请求、完整持有快照或可重新执行的发奖计划。
message RewardGrantResult {
  required string role_id = 1;
  repeated RewardOutcome items = 2;
  required RewardWallet wallet = 3;
  repeated RewardStackCredit stacks = 4;
  repeated RewardExperienceGain experience = 5;
  repeated RewardTavernChange tavern = 6;
  repeated RewardBonus bonuses = 7;
  repeated TimedItem timed_items = 8;
  required SpiritInventory spirits = 9;
}

// requested等于credited加ignored；零到账仍保留真实减少原因。
message RewardOutcome {
  required uint32 item_id = 1;
  required int64 requested = 2;
  required int64 credited = 3;
  required int64 ignored = 4;
  // NONE、ROLE_MAX_LEVEL或TAVERN_CAP，与服务端实际规则一致。
  required string reason = 5;
}

// 冻结发放前后钱包，含直接奖励及升级附赠；历史余额不写当前Model。
message RewardWallet {
  required int64 gold_before = 1;
  required int64 diamonds_before = 2;
  required int64 gold_after = 3;
  required int64 diamonds_after = 4;
}

// 稳定记录ID保留stack:等真实格式，不能转成数字或统一改为UUID。
message RewardStackCredit {
  required uint32 item_id = 1;
  required string instance_id = 2;
  required int64 before_quantity = 3;
  required int64 quantity = 4;
  required int64 after_quantity = 5;
}

// 接纳经验包含跨级消耗；diamonds仅记录本次升级附赠，不混入理论直接奖励。
message RewardExperienceGain {
  required uint32 before_level = 1;
  required int64 before_experience = 2;
  required int64 requested = 3;
  required int64 accepted = 4;
  required int64 ignored = 5;
  required uint32 level = 6;
  required int64 experience = 7;
  required int64 diamonds = 8;
}

// 领取时冻结的酒馆上限；已有余额超过上限时不倒扣。
message RewardTavernChange {
  required int64 before_quantity = 1;
  required int64 limit = 2;
  required int64 after_quantity = 3;
}

// 附赠与理论基础奖励分开；当前source仅为ROLE_LEVEL_UP。
message RewardBonus {
  required string source = 1;
  required uint32 item_id = 2;
  required int64 quantity = 3;
}

// 挂机演出战报，不是挑战凭证，不产生奖励；输入版本用于避免展示已变更的阵容。
message IdleEncounter { required uint32 stage = 1; required int64 asset_revision = 2; required int64 lineup_version = 3; required BattleReplay replay = 4; }
