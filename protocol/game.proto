// 新版游戏业务唯一通信契约；生成 TS/Java，禁止复用已发布字段号。
// WebSocket 使用 mxzg.protobuf.v2 子协议，线上使用 WSS；不是旧服协议兼容层。
syntax = "proto2";
package mxzg.game;
option java_package = "com.funsgamex.mxzg.protocol";
option java_outer_classname = "GameProtocol";

// 信封只关联一次传输；业务幂等键须由具体业务另行定义。
message Frame {
  required uint32 version = 1;
  required string kind = 2;
  required string name = 3;
  optional string id = 4;
  optional string connection_id = 5;
  optional bool ok = 6;
  optional Failure error = 7;
  oneof payload {
    Authenticate authenticate = 10;
    Accepted accepted = 11;
    Snapshot snapshot = 12;
    Inventory inventory = 13;
    Heartbeat heartbeat = 14;
    Kicked kicked = 15;
    Empty empty = 16;
    Login login = 17;
    Servers servers = 18;
    GmGrant gm_grant = 19;
    GmResult gm_result = 20;
    GmStatus gm_status = 21;
    FormationSave formation_save = 22;
    FormationSaved formation_saved = 23;
    BattlePreviewRequest battle_preview = 24;
    BattlePreviewResult battle_previewed = 25;
    ChapterChallenge chapter_challenge = 26;
    ChapterBattleId chapter_battle_id = 27;
    ChapterReceipt chapter_receipt = 28;
    ChapterReplay chapter_replay = 29;
    IdleEncounter idle_encounter = 30;
    ChapterIdleClaim chapter_idle_claim = 31;
    ChapterIdleClaimStatusRequest chapter_idle_claim_status_request = 32;
    ChapterIdleClaimReceipt chapter_idle_claim_receipt = 33;
    ChapterIdleClaimStatus chapter_idle_claim_status = 34;
    RewardNotice reward_notice = 35;
    ChapterMilestoneClaim chapter_milestone_claim = 36;
    ChapterMilestoneReceipt chapter_milestone_receipt = 37;
    ChapterMilestoneStatus chapter_milestone_status = 38;
    // 普通单抽和历史首抽共用同一请求、到账结构；是否免费由服务端判定。
    HeroFirstSummonRequest hero_first_summon_request = 39;
    HeroFirstSummonReceipt hero_first_summon_receipt = 40;
    HeroFirstSummonStatus hero_first_summon_status = 41;
    ChapterFirstRewardRequest chapter_first_reward_request = 42;
    ChapterFirstRewardReceipt chapter_first_reward_receipt = 43;
    ChapterFirstRewardStatus chapter_first_reward_status = 44;
    HeroFragmentCombineRequest hero_fragment_combine_request = 45;
    HeroFragmentCombineStatusRequest hero_fragment_combine_status_request = 46;
    HeroFragmentCombineReceipt hero_fragment_combine_receipt = 47;
    HeroFragmentCombineStatus hero_fragment_combine_status = 48;
    HeroLevelUpgradeRequest hero_level_upgrade_request = 49;
    HeroLevelUpgradeStatusRequest hero_level_upgrade_status_request = 50;
    HeroLevelUpgradeReceipt hero_level_upgrade_receipt = 51;
    HeroLevelUpgradeStatus hero_level_upgrade_status = 52;
    // 随机名成功回包和首次命名请求都只携带昵称。
    RoleName role_name = 53;
    HeroSummonRequest hero_summon_request = 54;
    HeroSummonReceipt hero_summon_receipt = 55;
    HeroEquipmentChangeRequest hero_equipment_change_request = 56;
    HeroEquipmentChangeReceipt hero_equipment_change_receipt = 57;
    MarketState market_state = 58;
    MarketBuyRequest market_buy_request = 59;
    MarketRefreshRequest market_refresh_request = 60;
    MarketReceipt market_receipt = 61;
    DailyDungeonState daily_dungeon_state = 62;
    DailyDungeonChallengeRequest daily_dungeon_challenge_request = 63;
    DailyDungeonReceipt daily_dungeon_receipt = 64;
    GmSetRoleLevel gm_set_role_level = 65;
    GmSetChapter gm_set_chapter = 66;
    GmSetTime gm_set_time = 67;
    GmTime gm_time = 68;
    RoleImageChange role_image_change = 69;
    RoleRename role_rename = 70;
    RoleTitles role_titles = 71;
    RoleImages role_images = 72;
    RoleDecorations role_decorations = 73;
    RoleDecorationId role_decoration_id = 74;
    RolePeerageDisplay role_peerage_display = 75;
    HeroStageAdvanceRequest hero_stage_advance_request = 76;
    HeroStageAdvanceReceipt hero_stage_advance_receipt = 77;
    HeroStageAdvanceStatus hero_stage_advance_status = 78;
    HeroStageAdvanceStatusRequest hero_stage_advance_status_request = 79;
    HeroLockSetRequest hero_lock_set_request = 80;
    HeroLockSetReceipt hero_lock_set_receipt = 81;
    HeroStarUpgradeRequest hero_star_upgrade_request = 82;
    HeroStarUpgradeReceipt hero_star_upgrade_receipt = 83;
    HeroJewelChangeRequest hero_jewel_change_request = 84;
    HeroJewelChangeReceipt hero_jewel_change_receipt = 85;
    HeroGodEquipmentChangeRequest hero_god_equipment_change_request = 86;
    HeroGodEquipmentChangeReceipt hero_god_equipment_change_receipt = 87;
    HeroGodEquipmentDrawRequest hero_god_equipment_draw_request = 88;
    HeroGodEquipmentDrawReceipt hero_god_equipment_draw_receipt = 89;
    HeroArtifactChangeRequest hero_artifact_change_request = 90;
