message HeroLevelUpgradeStatus {
  required string request_id = 1;
  required bool found = 2;
  optional HeroLevelUpgradeReceipt receipt = 3;
}

// 英雄进阶固定提升一阶，费用、等级和星级要求由服务端按当前阶级确认。
message HeroStageAdvanceRequest {
  required string request_id = 1;
