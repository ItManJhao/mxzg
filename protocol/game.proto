// 通用发奖反馈仅描述已提交的实际到账，不更新客户端资产；资产仍走Snapshot。
message RewardNotice {
  required uint32 schema_version = 1;
  // 使用业务持久成功回执ID，和历史查询恢复共用同一个展示身份。
  required string receipt_id = 2;
  required string role_id = 3;
  required int64 asset_revision = 4;
  // SILENT / POPUP / TIPS；当前通用展示不接受客户端上报或自行猜测模式。
  required string mode = 5;
  repeated RewardNoticeItem items = 6;
  // 可选关联原业务请求；展示身份仍为receipt_id，不建立另一份发奖身份。
  optional string request_id = 7;
  // 同笔发奖真实发生的角色升级；无升级不携带，不能用当前Snapshot反推历史等级。
  optional RewardRoleUpgrade role_upgrade = 8;
  // 本次真正创建的英雄实例，复用原反馈回执和队列，不以当前名册反推。
  repeated RewardHeroGrant heroes = 9;
}
// 发奖时冻结的新英雄身份与合法初始成长，只供获得英雄展示，不覆盖当前名册。
message RewardHeroGrant {
  required string instance_id = 1;
  required uint32 template_id = 2;
  required uint32 level = 3;
  required uint32 star = 4;
  required uint32 stage = 5;
}
// 原发奖经验链的起止等级；只用于通用升级表现，不写回角色资产或新建奖励身份。
message RewardRoleUpgrade {
  required uint32 before_level = 1;
  required uint32 after_level = 2;
}
// credited为本次真正到账的正安全整数，含已合并的升级附赠，不是理论量或钱包余额。
message RewardNoticeItem {
  required uint32 item_id = 1;
  required int64 credited = 2;
}
// 本地身份交换只在 local 后端启用，生产渠道认证另行接入。
message Login { required string account = 1; required string server_id = 2; required string client_instance_id = 3; }
message Session { required string access_token = 1; required string expires_at = 2; }
message Server {
  required string id = 1;
  required string region_id = 2;
  required string region_name = 3;
  required string name = 4;
  required bool enabled = 5;
  // 内网目录登记的个人实例入口。缺省时，所选区服由提供目录的游戏地址承载。
  optional string socket_url = 6;
}
message Servers { repeated Server items = 1; }
message Authenticate {
  required string access_token = 1;
  required string client_instance_id = 2;
}
message Accepted {
  required string connection_id = 1;
  required string role_id = 2;
  required int64 server_time_ms = 3;
  required Snapshot initial = 4;
  optional Session session = 5;
}
message Heartbeat { required int64 server_time_ms = 1; }
message Failure {
  required string code = 1;
  required string message = 2;
  required bool retryable = 3;
}
message Kicked { required string code = 1; }
message Role {
  required string id = 1;
  required string nickname = 2;
  required uint32 level = 3;
  required int64 gold = 4;
  required int64 diamonds = 5;
  required string server_id = 6;
  // 基础资料独立扩展，缺失表示尚未同步，不能当作全零玩家。
  optional RoleBasics basics = 7;
  // 首次命名进度；false 表示尚未命名，缺失表示快照未提供此能力。
  optional bool first_named = 8;
  // 当前角色是否可以领取一次性新手赠礼，缺失表示快照未提供此能力。
  optional bool welcome_gift_available = 9;
  // 对外显示的十进制角色编号。角色、会话及资产归属继续使用 id。
  optional string public_id = 10;
  // 空字符串表示已同步且未参加公会。缺失表示采集此快照时尚无该字段。
  optional string guild_name = 11;
  // 与公会成员列表共用的当前主阵战力。
  optional uint32 power = 12;
}
// 候选昵称仅用于填入表单；成功保存后的昵称仍由统一角色快照交付。
message RoleName { required string nickname = 1; }
// 个人空间形象和头像为独立资料。客户端提交形象配置 ID，服务端检查解锁。
message RoleImageChange { required uint32 image_id = 1; }
// 二次改名确认的支付类型。1 为钻石，2 为改名卡。
message RoleRename {
  required string nickname = 1;
  required uint32 payment_type = 2;
}
message RoleTitle {
  required uint32 idx = 1;
  // -1 为永久，0 为已回收，正数为到期 Unix 秒。
  required int64 end_time_seconds = 2;
}
message RoleTitles { repeated RoleTitle titles = 1; }
message RoleImages { repeated uint32 image_ids = 1; }
// 头像与头像框按服务端验证。0 是可选择的默认头像框。
message RoleDecorationId { required uint32 id = 1; }
message RolePeerageDisplay { required bool visible = 1; }
message RoleBorder {
  required uint32 id = 1;
  // -1 为永久，正数为到期 Unix 秒。
  required int64 expires_at_seconds = 2;
}
// 已解锁的头像、已激活的头像框及贵重标记资格。
message RoleDecorations {
  repeated uint32 head_ids = 1;
  repeated RoleBorder borders = 2;
  required int64 total_recharge = 3;
  required bool show_peerage = 4;
}
// 对照旧 2001；经验为本级经验，时间为 Unix 秒，0 时间表示历史未知。
message RoleBasics {
  required int64 experience = 1;
  required uint32 cup = 2;
  required uint32 head_id = 3;
  required uint32 image_id = 4;
  required uint32 border_id = 5;
  required uint32 language = 6;
  required int64 created_at_seconds = 7;
  required int64 last_login_at_seconds = 8;
  // 来自 mainlevel 当前级门槛；最高级为 0，不授予升级或奖励。
  required int64 experience_to_next_level = 9;
}
message Hero {
  required string id = 1;
  required uint32 template_id = 2;
  required uint32 level = 3;
  required uint32 star = 4;
  // 英雄自身的持久锁定，不等于未获得或阵容占用；缺失表示旧快照尚未同步。
  optional bool locked = 5;
  // 是否在主线阵容中；由服务端按本角色持久阵容计算。
  optional bool deployed = 6;
  optional uint32 stage = 7;
  // 仅基础成长属性，不含尚未恢复的装备/天赋等加成。
  optional HeroBaseStats base_stats = 8;
  // 普通四槽的完整穿戴状态；缺失表示未同步，空 items 表示未穿戴。
  optional HeroEquipmentState equipment = 9;
  // 服务端面板计算及覆盖范围；未完整恢复时 complete=false。
  optional HeroPanelStats panel_stats = 10;
  optional HeroEvolution evolution = 11;
  // 已镶嵌宝石随英雄同步；普通背包只保存未镶嵌数量。
  optional HeroJewelState gems = 12;
}
message HeroBaseStats { required uint32 hp = 1; required uint32 atk = 2; required uint32 def = 3; required uint32 spd = 4; }
message Item {
  required uint32 item_id = 1;
  required int64 quantity = 2;
  // 稳定数据 ID；item_id 保持原配置 ID 含义，禁止重用字段号。
  optional string instance_id = 3;
}
message Inventory { repeated Item items = 1; }
// 快速战斗当前报出的使用次数与钻石价格，按上海自然日更新。
message ChapterQuickBattleState {
  required bool unlocked = 1;
  required uint32 used_count = 2;
  required uint32 max_count = 3;
  required int64 cost_diamonds = 4;
  required int64 reset_at = 5;
  required bool tavern_full = 6;
}
// 携带已展示的日期和档位，服务端拒绝过时报价，避免锁定后按下一档扣费。
message ChapterQuickBattleClaim {
  required string request_id = 1;
  required int64 reset_at = 2;
  required uint32 used_count = 3;
}
message ChapterQuickBattleReceipt {
  required string request_id = 1;
  required string receipt_id = 2;
  required int64 asset_revision = 3;
  required ChapterQuickBattleState state = 4;
  required RewardGrantResult actual = 5;
  required string role_id = 6;
  optional RewardNotice notice = 7;
}
message Snapshot {
  required Role role = 1;
  repeated Hero heroes = 2;
  repeated Item inventory = 3;
  required int64 revision = 4;
  optional TimedInventory timed_inventory = 5;
  optional HeroRoster hero_roster = 6;
  optional MainFormation main_formation = 7;
  optional MainChapterState main_chapter = 8;
  optional MainChapterIdleState main_chapter_idle = 9;
  // 精灵独立实例；缺失表示未同步，不能混入按item_id唯一的普通库存。
  optional SpiritInventory spirit_inventory = 10;
  // 独立持久冒险点；缺失表示尚未同步，合法0与超上限余额均按服务端原值保留。
  optional TavernPointState tavern_points = 11;
  // 召唤状态随登录、重连和资产推送同步；未使用免费次数时相应时间为 0。
  optional HeroSummonState hero_summon = 12;
  // 独立神装库存含在库与已穿实例，虚拟列表复用统一快照。
  optional HeroGodEquipmentState god_equipment = 13;
  // 圣器激活格位与独立实例随名册一起同步。
  optional HeroArtifactState artifacts = 14;
  // 当前女神 VIP 与任务进度随同一角色事务恢复。
  optional VipState vip = 15;
  // 历史最高星级，英雄用作素材后仍保留。缺失表示旧快照未同步。
  optional HeroIllustrationState hero_illustration = 16;
}

message HeroIllustrationState {
  repeated HeroIllustrationEntry entries = 1;
}

// 依英雄模板累计的历史进度，与名册中的独立英雄实例分开。
message HeroIllustrationEntry {
  required uint32 template_id = 1;
  required uint32 max_star = 2;
}

message VipState {
  required uint32 level = 1;
  repeated VipTask tasks = 2;
}

message VipTask {
  required uint32 id = 1;
  required uint32 target = 2;
  // 没有接通权威进度来源时省略。明确的 0 代表已同步且没有进度。
  optional uint32 progress = 3;
  required bool claimed = 4;
}

message VipClaimRequest {
  required string request_id = 1;
  required uint32 task_id = 2;
}

message VipClaimReceipt {
  required string request_id = 1;
  required string role_id = 2;
  required int64 asset_revision = 3;
  required uint32 task_id = 4;
  // 与通用奖励推送共用回执标识，历史回包不会再次发放。
  required RewardNotice notice = 5;
}

message HeroSummonState {
  required uint32 schema_version = 1;
  required bool first_normal_completed = 2;
  required int64 normal_free_at_seconds = 3;
  // 高级单抽的下次免费时间（服务端 Unix 秒）；缺失表示旧服务未提供高级召唤。
  optional int64 advanced_free_at_seconds = 4;
  // 是否符合积分兑换的角色条件；现有积分和实际消耗分别同步。
  optional bool points_exchange_available = 5;
  optional int64 point_recharge_required = 6;
  optional uint32 points_cost = 7;
  // 已购买的祈愿资格到期时间（服务端 Unix 秒），没有资格时为 0。
  optional int64 prayer_ends_at_seconds = 8;
}

// hero.summon.normal 与历史 hero.summon.first 共用单抽请求结构，只传本次操作编号。
message HeroFirstSummonRequest { required string request_id = 1; }

// 每次普通单抽成功都返回本次实际获得的英雄与奖励；扣券后的余额随快照同步。
message HeroFirstSummonReceipt {
  required uint32 schema_version = 1;
  required string request_id = 2;
  required string receipt_id = 3;
  required string role_id = 4;
  required int64 asset_revision = 5;
  required HeroSummonState state = 6;
  required RewardGrantResult actual = 7;
}

// 找到时返回原成功回执；未找到时不带 receipt。
message HeroFirstSummonStatus {
  required string request_id = 1;
  required bool found = 2;
  optional HeroFirstSummonReceipt receipt = 3;
}

// NORMAL / FRIENDSHIP / ADVANCED 为三类召唤池，POINTS 为积分兑换。
message HeroSummonRequest {
  required string request_id = 1;
  required string pool = 2;
  required uint32 count = 3;
  // 只有玩家确认的高级召唤才可消耗钻石，缺失或 0 均不允许扣钻。
  optional int64 max_diamonds = 4;
}

// 本次已提交的召唤结果，池和次数与原操作一致，实际获得的英雄供客户端展示。
message HeroSummonReceipt {
  required uint32 schema_version = 1;
  required string request_id = 2;
  required string receipt_id = 3;
  required string role_id = 4;
  required int64 asset_revision = 5;
  required HeroSummonState state = 6;
  required RewardGrantResult actual = 7;
  required string pool = 8;
  required uint32 count = 9;
}

// 旧酒馆冒险点只读状态，不开放任务、刷新或领取；上限来自同次最高已通关关卡。
message TavernPointState {
  required uint32 schema_version = 1;
  required int64 adventure_count = 2;
  required int64 limit = 3;
}

// 服务端最终容量已经包含 VIP 加成；缺失表示尚未同步，不能当作零容量。
message HeroRoster {
 required uint32 capacity = 1;
 required uint32 buy_space_times = 2;
}

// 期限道具每件一个实例；时间单位为 Unix 秒，与角色等级等无关。
message TimedItem {
 required string instance_id = 1;
 required uint32 item_id = 2;
 required int64 active_at_seconds = 3;
 required int64 expires_at_seconds = 4;
}
message TimedInventory {
 repeated TimedItem items = 1;
 required int64 server_time_seconds = 2;
}

// 当前只恢复2000002的真实实例和只读背包展示，不开放养成或穿脱协议。
message SpiritInventory {
  required uint32 schema_version = 1;
  repeated SpiritItem items = 2;
}
message SpiritItem {
  // 与配置ID分开；同配置同属性的实例也不能合并，字符串保留持久身份。
  required string instance_id = 1;
  required uint32 item_id = 2;
  // 旧实际生成和持久链只有一个能力，不沿旧Lua描述符改成多能力。
  required uint32 ability_id = 3;
  repeated SpiritSkill skills = 4;
}
message SpiritSkill {
  required uint32 sort = 1;
  required uint32 skill_id = 2;
  required uint32 level = 3;
}

// 本机开发 GM；目标角色只从鉴权连接获取。
message GmGrant { required string request_id = 1; required string kind = 2; required uint32 config_id = 3; required uint32 quantity = 4; }
message GmResult { required string request_id = 1; required string kind = 2; required uint32 config_id = 3; required uint32 quantity = 4; }
message GmStatus { required bool enabled = 1; }
// 只设置当前鉴权角色。请求和回执共用绝对目标，资产以快照为准。
message GmSetRoleLevel {
  required string request_id = 1;
  required uint32 level = 2;
}
// mission 是当前要挑战的全局关卡，不是已经通关的数量。
message GmSetChapter {
  required string request_id = 1;
  required uint32 mission = 2;
}
// 开发实例游戏时间的 Unix 秒。0 恢复系统时间。
message GmSetTime { required int64 unix_seconds = 1; }
// 读取或修改后返回的权威游戏时间，用于界面立即校准。
message GmTime {
  required int64 server_time_ms = 1;
  required bool overridden = 2;
}

// 装备实例 ID 用字符串保留精度，不与配置 ID 混用。
message HeroEquipment { required string instance_id = 1; required uint32 template_id = 2; required uint32 slot = 3; required uint32 soul_level = 4; optional HeroSoulSkill soul_skill = 5; }
message HeroEquipmentState { repeated HeroEquipment items = 1; }
message HeroPanelValues { required int64 hp = 1; required int64 atk = 2; required int64 def = 3; required int64 spd = 4; }
message HeroPanelStats {
  required HeroPanelValues values = 1;
  repeated string included_sources = 2;
  repeated string pending_sources = 3;
  required bool complete = 4;
  // 当前已纳入面板计算来源的个人战力；旧快照缺失时不能推断为零。
  optional uint32 power = 5;
}
// 缺失表示未生效；由服务端结合真实英雄与装备门槛计算。
message HeroSoulSkill { required uint32 skill_id = 1; required uint32 level = 2; }

// 0/0明确未进化；缺失表示未同步，技能覆盖由服务端验证。
message HeroEvolution { required uint32 type = 1; required uint32 level = 2; optional HeroSoulSkill skill = 3; }

// 只读主线阵型，所有状态由服务端持久化；未提供保存协议。
message MainFormation { required uint32 formation_id = 1; repeated uint32 unlocked_ids = 2; required bool assistance_unlocked = 3; required int64 version = 4; repeated FormationSlot slots = 5; repeated FormationOption options = 6; }
message FormationSlot { required uint32 position = 1; required string hero_id = 2; }

// 主线保存：角色归属由鉴权连接确定，request_id是持久幂等键。
message FormationSave {
  required string request_id = 1;
  required int64 expected_version = 2;
  required uint32 formation_id = 3;
  repeated FormationSlot slots = 4;
}
// 回执不直接写客户端Model；权威阵容仍随state.changed或重连快照同步。
message FormationSaved {
  required string request_id = 1;
  required int64 version = 2;
}

// 只读草稿估算；请求编号只关联本次草稿，按最多六名本人英雄评分，空列表为零。
message FormationPowerRequest {
  required string request_id = 1;
  repeated string hero_ids = 2;
}

// 原草稿身份和同次资产版本用于识别迟到结果，分值不写入已保存阵容或角色快照。
message FormationPower {
  required string request_id = 1;
  repeated string hero_ids = 2;
  required uint32 power = 3;
  required int64 asset_revision = 4;
}

// 可选阵型与当前允许站位由服务端同源配置投影，不由客户端猜测。
message FormationOption { required uint32 formation_id = 1; repeated uint32 open_positions = 2; }

// 主线、日常副本及只读验收共用的战报结构；具体请求与资产提交由各玩法管理。
message BattleReplay {
  required uint32 schema_version = 1;
  required string scenario = 2;
  required string outcome = 3;
  required uint32 rounds = 4;
  repeated BattleReplayUnit units = 5;
  repeated BattleReplayPhase phases = 6;
  // 开战时冻结的双方名称；旧战报缺失时不得使用当前昵称补历史。
  optional string attacker_name = 7;
  optional string defender_name = 8;
}
message BattleReplayUnit {
  required uint32 unit_id = 1;
  required uint32 template_id = 2;
  required uint32 position = 3;
  required int64 initial_hp = 4;
  required int64 final_hp = 5;
  // 服务端战斗快照等级；旧战报可解码，但展示层须明确拒绝缺失值。
  optional uint32 level = 6;
  // 本场阵营：1攻方、2守方，不从unit_id推断。
  optional uint32 faction = 7;
  // 与初始生命分开，残血入场也按真实最大生命显示血条。
  optional int64 max_hp = 8;
  // 服务端按旧HeroFightLog累计abs(实际扣血变化+护盾吸收)，缺失表示旧战报未记录，不能当0。
  optional int64 total_damage = 9;
  // 实际承伤绝对值；与旧伤害输出口径不同，不按飘字累计。
  optional int64 total_taken_damage = 10;
  // 旧replenish记录施法者的修正后治疗量，包含溢出治疗；保留有符号值，不取绝对值。
  optional int64 total_recovery = 11;
  // 本场英雄星级；旧战报缺失时不从当前名册补历史外观。
  optional uint32 star = 12;
  // 开战时按历史星级/进化解析的头像资源ID；缺失为旧战报，不读当前英雄补齐。
  optional uint32 portrait_icon_id = 13;
}
message BattleReplayPhase {
  required uint32 round = 1;
  // 0为回合开始，1/2为当前双单位验收场景出手者。
  required uint32 source_id = 2;
  repeated BattleReplayEvent events = 3;
}
// recovery事件复用actual_hp_change/reported_hp_change和dead=false；实际回血与含溢出治疗量不可混用。
message BattleReplayEvent {
  required string kind = 1;
  required uint32 source_id = 2;
  required uint32 target_id = 3;
  required uint32 config_id = 4;
  optional uint32 skill_level = 5;
  optional uint32 skill_type = 6;
  optional int64 actual_hp_change = 7;
  optional int64 reported_hp_change = 8;
  optional bool dead = 9;
  optional int64 buff_instance_id = 10;
  optional uint32 expires_at_round = 11;
  optional int64 buff_value = 12;
  optional string removal_reason = 13;
}

// 开发只读试战：只提交关卡，不接受角色、阵容、属性或伤害；不产生通关与奖励。
message BattlePreviewRequest { required uint32 mission = 1; }
message BattlePreviewResult {
  required uint32 mission = 1;
  required int64 asset_revision = 2;
  required int64 lineup_version = 3;
  required uint32 formation_id = 4;
  repeated string pending = 5;
  required BattleReplay replay = 6;
}

// 主线进度随登录及state.changed同步；缺失表示未同步，不默认未通关。
message MainChapterState {
  required uint32 max_cleared = 1;
  optional string pending_battle_id = 2;
  required int64 asset_revision = 3;
  // 缺失表示里程碑已领进度未同步；显式空claimed_ids才表示真实未领取，不能按通关数推断。
  optional ChapterMilestoneProgress milestone_progress = 4;
  // 服务端可信配置的当前挑战上限，与完整关卡目录分开；缺失表示范围未同步，不默认开放。
  optional uint32 challenge_limit = 5;
  // 独立通关奖励的权威进度，和战斗结算及里程碑不同源；缺失表示未同步。
  optional ChapterFirstRewardProgress first_reward_progress = 6;
}

message ChapterFirstRewardProgress {
  required uint32 schema_version = 1;
  repeated uint32 claimed_chapters = 2;
  repeated uint32 eligible_chapters = 3;
}

// 按全局通关关卡索引领取或查原回执，不接收奖励配置行idx。
message ChapterFirstRewardRequest { required uint32 chapter = 1; }

message ChapterFirstRewardReceipt {
  required uint32 schema_version = 1;
  required uint32 chapter = 2;
  required string receipt_id = 3;
  required string role_id = 4;
  required int64 asset_revision = 5;
  required RewardGrantResult actual = 6;
}

message ChapterFirstRewardStatus {
  required uint32 chapter = 1;
  required bool found = 2;
  optional ChapterFirstRewardReceipt receipt = 3;
}

// quantity 是生成英雄数量，实际扣除由服务端按物品配置计算。
message HeroFragmentCombineRequest {
  required string request_id = 1;
  required uint32 item_id = 2;
  required uint32 quantity = 3;
}

message HeroFragmentCombineStatusRequest { required string request_id = 1; }

message HeroFragmentCombineReceipt {
  required uint32 schema_version = 1;
  required string request_id = 2;
  required string receipt_id = 3;
  required string role_id = 4;
  required int64 asset_revision = 5;
  required uint32 item_id = 6;
  required uint32 quantity = 7;
  required int64 cost_quantity = 8;
  required RewardGrantResult actual = 9;
}

message HeroFragmentCombineStatus {
  required string request_id = 1;
  required bool found = 2;
  optional HeroFragmentCombineReceipt receipt = 3;
}

// 请求只传原等级及要升的级数，价格和上限由服务端配置决定。
message HeroLevelUpgradeRequest {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 expected_level = 3;
  required uint32 levels = 4;
}

message HeroLevelUpgradeStatusRequest { required string request_id = 1; }

// 同一身份按原请求编号查原收据；英雄、金币与经验从统一快照更新。
message HeroLevelUpgradeReceipt {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 from_level = 3;
  required uint32 to_level = 4;
  required string config_version = 5;
  required int64 asset_revision = 6;
  required string role_id = 7;
}

message HeroLevelUpgradeStatus {
  required string request_id = 1;
  required bool found = 2;
  optional HeroLevelUpgradeReceipt receipt = 3;
}

// 英雄进阶固定提升一阶，费用、等级和星级要求由服务端按当前阶级确认。
message HeroStageAdvanceRequest {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 expected_stage = 3;
}

message HeroStageAdvanceReceipt {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 from_stage = 3;
  required uint32 to_stage = 4;
  required string config_version = 5;
  required int64 asset_revision = 6;
  required string role_id = 7;
}

message HeroStageAdvanceStatusRequest { required string request_id = 1; }

message HeroStageAdvanceStatus {
  required string request_id = 1;
  required bool found = 2;
  optional HeroStageAdvanceReceipt receipt = 3;
}

// 设定英雄锁定状态；角色由当前连接确定。
message HeroLockSetRequest {
  required string request_id = 1;
  required string hero_id = 2;
  required bool locked = 3;
}

// 返回成功请求当时的设置和资产版本；当前名册仍从统一快照更新。
message HeroLockSetReceipt {
  required string request_id = 1;
  required string hero_id = 2;
  required bool locked = 3;
  required uint64 asset_revision = 4;
}

// 配方行从零开始。服务端重新核对实例和材料，不接受前端提供的价格。
message HeroStarMaterials {
  required uint32 row = 1;
  repeated string hero_ids = 2;
  required bool use_replacement = 3;
}
message HeroStarUpgradeRequest {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 expected_star = 3;
  repeated HeroStarMaterials materials = 4;
}
message HeroStarUpgradeReceipt {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 from_star = 3;
  required uint32 to_star = 4;
  repeated Item refunded = 5;
  required int64 asset_revision = 6;
  required string role_id = 7;
}

// 宝石离身按配置堆叠，佩戴期间保留槽位实例。
message HeroJewel {
  required string instance_id = 1;
  required uint32 template_id = 2;
  required uint32 slot = 3;
}
message HeroJewelState { repeated HeroJewel items = 1; }
message HeroJewelChangeRequest {
  required string request_id = 1;
  optional string hero_id = 2;
  required string action = 3;
  optional uint32 item_id = 4;
  optional uint32 slot = 5;
  optional uint32 expected_item_id = 6;
  optional uint32 count = 7;
  // 铁匠铺一键合成确认时绑定所见的持久资产版本。
  optional int64 expected_revision = 8;
}
message HeroJewelChangeReceipt {
  required string request_id = 1;
  required string role_id = 2;
  optional string hero_id = 3;
  required string action = 4;
  optional uint32 item_id = 5;
  optional uint32 slot = 6;
  optional uint32 expected_item_id = 7;
  optional uint32 count = 8;
  required int64 asset_revision = 9;
  required bool changed = 10;
  repeated Item rewards = 11;
  // 原一键合成预览的资产版本，旧入口没有此字段。
  optional int64 expected_revision = 12;
}

message GodEquipmentModifier {
