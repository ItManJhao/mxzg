  optional string hero_id = 4;
  repeated GodEquipmentModifier modifiers = 5;
  repeated GodEquipmentAttribute attributes = 6;
  required uint32 star = 7;
  required uint32 quality = 8;
}
message HeroGodEquipmentState {
  required uint32 required_role_level = 1;
  required uint32 required_world_level = 2;
  required uint32 required_hero_star = 3;
  required uint32 world_level = 4;
  repeated GodEquipmentItem items = 5;
  required uint32 draw_count = 6;
  required bool free_draw = 7;
  optional GodEquipmentShopState shop = 8;
}
message HeroGodEquipmentChangeRequest {
  required string request_id = 1;
  required string hero_id = 2;
  required uint32 slot = 3;
  required string action = 4;
  optional string instance_id = 5;
  optional string expected_instance_id = 6;
}
message HeroGodEquipmentChangeReceipt {
