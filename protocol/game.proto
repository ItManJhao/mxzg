}

// 每日任务、活跃奖励与成就均由当前角色的服务端任务状态提供。
message QuestClaimRequest {
  required string request_id = 1;
  required string kind = 2;
  required uint32 id = 3;
  required int64 reset_at = 4;
}

message QuestTask {
  required uint32 id = 1;
  required string title = 2;
  required int64 current = 3;
  required int64 target = 4;
  required bool claimed = 5;
  repeated ChapterReward rewards = 6;
  required string destination = 7;
}

message QuestMilestone {
  required uint32 id = 1;
  required uint32 points = 2;
  required bool claimed = 3;
  repeated ChapterReward rewards = 4;
}

message QuestSnapshot {
  required int64 reset_at = 1;
  required uint32 activity_points = 2;
  repeated QuestTask daily = 3;
  repeated QuestTask achievements = 4;
  repeated QuestMilestone milestones = 5;
}

message QuestClaimReceipt {
  required string request_id = 1;
  required QuestSnapshot snapshot = 2;
  optional RewardNotice notice = 3;
}

message QuestCompletion {
  required uint32 id = 1;
  required string title = 2;
}

message QuestChanged { repeated QuestCompletion completed = 1; }

// 排行榜仅公开榜单展示所需的角色与公会资料。
message RankingListRequest { required string kind = 1; }

message RankingLikeRequest {
  required string request_id = 1;
  required string kind = 2;
  required string target_id = 3;
  required int64 reset_at = 4;
}

message RankingEntry {
  required uint32 rank = 1;
  required string id = 2;
  required string server_id = 3;
  required string name = 4;
  required int64 score = 5;
  required uint32 level = 6;
  required uint32 head_id = 7;
  required uint32 border_id = 8;
  required uint32 badge_id = 9;
  required string leader_name = 10;
}

message RankingBoard {
  required string kind = 1;
  optional RankingEntry leader = 2;
  required bool liked = 3;
}

message RankingOverview {
  required uint32 cross_level = 1;
  required int64 reset_at = 2;
  repeated RankingBoard boards = 3;
  required bool cross_unlocked = 4;
}

message RankingDetail {
  required string kind = 1;
  repeated RankingEntry entries = 2;
  optional RankingEntry own = 3;
}

message RankingLikeReceipt {
  required string request_id = 1;
  required RankingOverview overview = 2;
  required RewardNotice notice = 3;
}

// 邮件列表只给摘要，正文和附件由打开邮件回执交付。
message MailEntry {
  required string id = 1;
  required string title = 2;
  required int64 created_at = 3;
  required bool read = 4;
  required bool claimed = 5;
  required bool has_attachments = 6;
}

message MailDetail {
  required string id = 1;
  required string content = 2;
  repeated ChapterReward attachments = 3;
}

message MailCommand {
  required string request_id = 1;
  required string action = 2;
  optional string mail_id = 3;
}

message MailboxState { repeated MailEntry entries = 1; }

message MailboxReceipt {
  required string request_id = 1;
  required MailboxState state = 2;
  optional MailDetail detail = 3;
  optional RewardNotice notice = 4;
}

// 聊天按频道及私聊对象请求。频道值沿用旧版，省略时为 2（本服世界）。
// 消息编号按十进制字符串传输，0 表示无游标。
message ChatHistoryRequest {
  optional string after_id = 1;
  optional string before_id = 2;
  optional uint32 channel = 3 [default = 2];
  optional string peer_role_id = 4;
}

message ChatSendRequest {
  required string request_id = 1;
  required string text = 2;
  optional uint32 channel = 3 [default = 2];
  optional string peer_role_id = 4;
}

message ChatReadRequest {
  required string through_id = 1;
  optional uint32 channel = 2 [default = 2];
  optional string peer_role_id = 3;
}

message ChatMessage {
  required string id = 1;
  required string role_id = 2;
  required string name = 3;
  required uint32 avatar_id = 4;
  required uint32 border_id = 5;
  required uint32 level = 6;
  required string text = 7;
  required uint64 sent_at_seconds = 8;
  optional uint32 channel = 9 [default = 2];
  optional string server_id = 10;
  // 旧策划公告编号，仅服务端消息携带。客户端按已实现的固定目标提供跳转。
  optional uint32 notice_id = 11;
}

message ChatHistory {
  repeated ChatMessage messages = 1;
  required string latest_id = 2;
  required string read_through_id = 3;
  required uint32 unread_count = 4;
  required bool has_more = 5;
  required bool has_newer = 6;
  required bool can_send = 7;
  optional uint32 channel = 8 [default = 2];
  optional string peer_role_id = 9;
  // 当前可读范围的标识，范围变化时必须重新开始拉取。
  optional string scope_id = 10;
}

message ChatSendResult {
  required string request_id = 1;
  required ChatMessage message = 2;
  optional string peer_role_id = 3;
}

// 当前角色能看到的频道和最近私聊，由服务端计算频道资格和未读。
message ChatChannelSummary {
  required uint32 channel = 1;
  required bool available = 2;
  required uint32 unread_count = 3;
}

message ChatConversation {
  required string role_id = 1;
  required string name = 2;
  required uint32 avatar_id = 3;
  required uint32 border_id = 4;
  required uint32 level = 5;
  required uint32 unread_count = 6;
  required string latest_message_id = 7;
}

message ChatOverview {
  repeated ChatChannelSummary channels = 1;
  repeated ChatConversation conversations = 2;
}

// 好友四页签共用公开的角色显示资料，关系与赠领状态按请求角色计算。
message FriendEntry {
  required string role_id = 1;
  required string server_id = 2;
  required string name = 3;
  required uint32 level = 4;
  required uint32 head_id = 5;
  required uint32 border_id = 6;
  required int64 power = 7;
  required int64 last_login_at = 8;
  required uint32 gift_state = 9;
  required bool sent_today = 10;
  required bool requested = 11;
}

message FriendState {
  required int64 reset_at = 1;
  required uint32 friend_limit = 2;
  required uint32 block_limit = 3;
  required uint32 sent_today = 4;
  required uint32 send_limit = 5;
  required int64 friendship = 6;
  repeated FriendEntry friends = 7;
  repeated FriendEntry gifts = 8;
  repeated FriendEntry applications = 9;
  repeated FriendEntry blocked = 10;
}

message FriendSearchRequest { required string query = 1; }

message FriendSearchResult {
  required string query = 1;
  repeated FriendEntry entries = 2;
}

message FriendChangeRequest {
  required string request_id = 1;
  required string action = 2;
  optional string target_id = 3;
  required int64 reset_at = 4;
}

message FriendChangeResult {
  required string request_id = 1;
  required FriendState state = 2;
  optional RewardNotice notice = 3;
}
message Empty {}
// 普通市场中的单个货架商品。最终售价、限购及已购数量均由服务端返回。
message MarketOffer {
  required uint32 product_id = 1;
  required uint32 item_id = 2;
  required int64 quantity = 3;
  required uint32 cost_item_id = 4;
  required int64 cost_quantity = 5;
  required uint32 purchase_limit = 6;
  required uint32 purchased = 7;
  // 折扣百分比，100 表示原价；cost_quantity 已是实际售价。
  required uint32 discount = 8;
  // 商品的奖励发放已接通时为 true，已购买数量仍需与限购单独比较。
  required bool purchasable = 9;
}
// 查询或修改货架后返回的市场状态。玩家钱包和库存仍由统一资产快照交付。
message MarketState {
  required int64 shelf_version = 1;
  repeated MarketOffer offers = 2;
  required uint32 free_refreshes = 3;
  required uint32 paid_refreshes = 4; // 本日已消耗的付费次数
  // 服务器 Unix 秒，免费次数已满时没有下次恢复时间，取 0。
  required int64 next_free_refresh_at = 5;
  required int64 next_paid_reset_at = 6;
  required uint32 refresh_cost_item_id = 7;
  required int64 refresh_cost_quantity = 8;
  required uint32 free_refresh_limit = 9;
  required uint32 paid_refresh_limit = 10;
}
// 购买以本次查看的货架版本和配置商品为准，扣费和发放由服务端确定。
message MarketBuyRequest {
  required string request_id = 1;
  required int64 shelf_version = 2;
  required uint32 product_id = 3;
  required uint32 count = 4;
}
// 先消耗免费次数，再按配置扣费。只提交当前货架版本和业务请求编号。
message MarketRefreshRequest {
  required string request_id = 1;
  required int64 shelf_version = 2;
}
// 成功操作回执用于关联本次结果和已提交资产版本，货架状态仅供市场模块显示。
message MarketReceipt {
  required string request_id = 1;
  required string role_id = 2;
  required int64 asset_revision = 3; // 免费刷新沿用现有版本，未发生资产提交时可为 0
  required MarketState state = 4;
}

// 以实际商店类型选择黑市货架，未实现兑换的页签仍可查看策划商品。
message BlackMarketListRequest {
  required uint32 shop_type = 1;
}

message BlackMarketBuyRequest {
  required string request_id = 1;
  required uint32 shop_type = 2;
  required int64 shelf_version = 3;
  required uint32 product_id = 4;
  required uint32 count = 5;
}

message BlackMarketTab {
  required uint32 shop_type = 1;
  required string name = 2;
  required uint32 minimum_level = 3;
  required bool available = 4;
}

message BlackMarketState {
  required uint32 shop_type = 1;
  required int64 shelf_version = 2;
  // 服务器 Unix 秒，0 表示该货架没有定时更新。
  required int64 next_refresh_at = 3;
  required uint32 currency_item_id = 4;
  repeated BlackMarketTab tabs = 5;
  // 限购为 0 的商品代表不限购。
  repeated MarketOffer offers = 6;
}

message BlackMarketReceipt {
  required string request_id = 1;
  required string role_id = 2;
  required int64 asset_revision = 3;
  required BlackMarketState state = 4;
}

// 预演一个部位的装备连锁合成，返回当前资产版本、消耗金币和净产物。
message SmithPreviewRequest {
  required uint32 slot = 1;
}

message SmithForgeRequest {
  required string request_id = 1;
  required uint32 item_id = 2;
  required uint32 count = 3;
}

message SmithForgeAllRequest {
  required string request_id = 1;
  required uint32 slot = 2;
  required int64 expected_revision = 3;
}

message SmithPreview {
  required uint32 slot = 1;
  required int64 asset_revision = 2;
  required int64 gold_cost = 3;
  repeated ChapterReward rewards = 4;
}

message SmithReceipt {
  required string request_id = 1;
  required string role_id = 2;
  required int64 asset_revision = 3;
  required uint32 slot = 4;
  required uint32 item_id = 5; // 一键合成回执为 0。
  required uint32 count = 6;   // 一键合成回执为 0。
  required int64 gold_cost = 7;
  repeated ChapterReward rewards = 8;
}

// 公会查询只接受当前区服中的名称筛选。页码从 1 开始。
message GuildListRequest {
  optional string query = 1;
  optional uint32 page = 2;
}
// 角色来自鉴权连接，幂等键区分同一角色的不同操作。
message GuildChangeRequest {
  required string request_id = 1;
  required string action = 2;
  optional string guild_id = 3;
  optional string applicant_id = 4;
  optional string name = 5;
  optional string description = 6;
  // 建会时选择的公会徽章，编号 0 至 43。
  optional uint32 badge_id = 7;
}
message GuildSummary {
  required string id = 1;
  required string name = 2;
  required uint32 member_count = 3;
  required uint32 capacity = 4;
  required string description = 5;
  optional uint32 badge_id = 6;
  // 本级已积累经验及旧等级表的显示门槛，由公会服务统一读取。
  optional uint32 level = 7;
  optional uint32 experience = 8;
  optional uint32 next_level_experience = 9;
}
message GuildMember {
  required string id = 1;
  required string nickname = 2;
  required uint32 level = 3;
  required bool leader = 4;
  optional uint32 head_id = 5;
  optional uint32 border_id = 6;
  // 当前主阵战力，空阵容为 0，缺字段表示尚未同步。
  optional uint32 power = 7;
}
// 统一返回当前成员状态。审批列表仅对有权限的成员交付。
message GuildState {
  optional string request_id = 1;
  required uint32 level_required = 2;
  required uint32 create_cost_diamonds = 3;
  required uint32 name_limit = 4;
  optional GuildSummary guild = 5;
  repeated GuildMember members = 6;
  repeated GuildMember applications = 7;
  repeated GuildSummary guilds = 8;
  required uint32 page = 9;
  required bool has_more = 10;
  repeated string applied_guild_ids = 11;
  required int64 rejoin_at_seconds = 12;
}

// 商品报价按公会余额货币与当前周结算。reset_at_seconds 绑定打开时的报价周期。
message GuildShopBuyRequest {
  required string request_id = 1;
  required string guild_id = 2;
  required uint32 product_id = 3;
  required uint32 count = 4;
  required int64 reset_at_seconds = 5;
}
message GuildShopProduct {
  required uint32 product_id = 1;
  required uint32 item_id = 2;
  required uint32 quantity = 3;
  required uint32 cost = 4;
  required uint32 limit = 5;
  required uint32 purchased = 6;
  required bool purchasable = 7;
}
message GuildShopState {
  optional string request_id = 1;
  required string guild_id = 2;
  required int64 reset_at_seconds = 3;
  repeated GuildShopProduct products = 4;
}

// 两项写操作共用当前公会、当前自然日和持久幂等键；option 指档位或对应宝箱编号。
message GuildDonationRequest {
  required string request_id = 1;
  required string guild_id = 2;
  required int64 reset_at = 3;
  required uint32 option_id = 4;
}
message GuildDonationTier {
  required uint32 id = 1;
  required uint32 cost_item_id = 2;
  required uint32 cost_amount = 3;
  required uint32 medals = 4;
