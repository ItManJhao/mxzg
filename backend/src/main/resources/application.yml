spring:
  application:
    name: mxzg-remake
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${MXZG_DATABASE_URL}
    username: ${MXZG_DATABASE_USER}
    password: ${MXZG_DATABASE_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${MXZG_PORT:18080}
mxzg:
  main-chapter:
    # 完整目录按配置装载；已接通连续1至20关，后续扩范围仍须通过依赖预检。
    challenge-limit: ${MXZG_MAIN_CHAPTER_CHALLENGE_LIMIT:20}
    # 默认关闭新领取；local单独开启，历史成功回执不受开关影响。
    idle-claim-enabled: ${MXZG_MAIN_CHAPTER_IDLE_CLAIM_ENABLED:false}
