spring:
  application:
    name: mxzg-remake
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${MXZG_DATABASE_URL}
    username: ${MXZG_DATABASE_USER}
    password: ${MXZG_DATABASE_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${MXZG_PORT:18080}
mxzg:
  main-chapter:
    # 仅独立测试显式开启；现有宝箱按钮仍关闭，历史成功回执不受开关影响。
    idle-claim-enabled: ${MXZG_MAIN_CHAPTER_IDLE_CLAIM_ENABLED:false}
