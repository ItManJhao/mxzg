# 本机开发配置：与旧项目数据库及端口隔离，GM默认开启方便准备当前测试角色。
# 只由local环境加载；可显式设置MXZG_GM_ENABLED=false关闭，production仍不装配GM服务。
spring:
  datasource:
    url: jdbc:h2:file:./.local/game;MODE=MySQL;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0
    username: sa
    password: ""
server:
  address: 127.0.0.1
mxzg:
  gm:
    enabled: ${MXZG_GM_ENABLED:true}
  websocket:
    enabled: true
