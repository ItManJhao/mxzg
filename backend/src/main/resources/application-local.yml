# 本机开发配置：与旧项目数据库及端口隔离，GM默认开启方便准备当前测试角色。
# 只由local环境加载；可显式设置MXZG_GM_ENABLED=false关闭，production仍不装配GM服务。
spring:
  datasource:
    url: jdbc:h2:file:./.local/game;MODE=MySQL;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0
    username: sa
    password: ""
server:
  address: 127.0.0.1
mxzg:
  # 共享机发布内网目录文件；个人实例在独立库中登记单一 ID，并允许共享 H5 的精确来源。
  lan:
    directory-file: ${MXZG_LAN_DIRECTORY_FILE:}
    personal-id: ${MXZG_LAN_PERSONAL_ID:}
    personal-name: ${MXZG_LAN_PERSONAL_NAME:}
    shared-origin: ${MXZG_LAN_SHARED_ORIGIN:}
  chat:
    # 两种跨区频道在本机由真实的两个开发服验收。其他部署默认没有聊天房间映射。
    cross-rooms: ${MXZG_CHAT_CROSS_ROOMS:local-1=dev-cross,local-2=dev-cross}
    global-rooms: ${MXZG_CHAT_GLOBAL_ROOMS:local-1=dev-global,local-2=dev-global}
  main-chapter:
    # 复用真实领取事务；缺权威活动控制时明确拒绝，不补假开服时间或跳过奖励来源。
    idle-claim-enabled: ${MXZG_MAIN_CHAPTER_IDLE_CLAIM_ENABLED:true}
  gm:
    enabled: ${MXZG_GM_ENABLED:true}
  websocket:
    enabled: true
